<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DL English 教師工作台</title>
<style>
  :root {
    --bg: #fdfaf6; --sidebar: #fff5f7; --card: #ffffff;
    --primary: #ff8fa3; --primary-dark: #e06c82; --secondary: #a2d2ff;
    --mint: #b8e0d2; --lavender: #cdb4db; --text: #4a4238;
    --muted: #8c8275; --border: #f0e6dc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Login Overlay */
  .login-screen {
    position: fixed; inset: 0; z-index: 999;
    background: linear-gradient(135deg, #fff5f7 0%, #fdfaf6 50%, #eef7ff 100%);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card {
    background: #fff; border: 2px solid #f3d5dc; border-radius: 24px;
    padding: 32px 26px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 12px 32px rgba(255,143,163,0.18);
  }
  .login-avatar {
    width: 84px; height: 84px; border-radius: 50%; background: #fff0d6;
    margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;
    font-size: 44px; border: 4px solid var(--primary);
  }
  .login-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    background: var(--primary); color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; margin-top: 16px; box-shadow: 0 6px 16px rgba(255,143,163,0.35);
  }
  .login-btn:hover { background: var(--primary-dark); }

  /* Layout */
  .app-wrap { display: flex; min-height: 100vh; }
  .sidebar {
    width: 235px; background: var(--sidebar); border-right: 2px solid var(--border);
    padding: 18px 14px; display: flex; flex-direction: column; justify-content: space-between;
    position: sticky; top: 0; height: 100vh; flex-shrink: 0;
  }
  .brand { text-align: center; padding-bottom: 14px; border-bottom: 1px dashed #f3d5dc; }
  .cookie-avatar {
    width: 56px; height: 56px; border-radius: 50%; background: #fff0d6;
    margin: 0 auto 6px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; border: 3px solid var(--primary);
  }
  .brand h1 { font-size: 17px; color: var(--primary-dark); }
  .brand p { font-size: 12px; color: var(--muted); }
  .nav { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; overflow-y: auto; }
  .nav-btn {
    border: none; background: transparent; padding: 10px 12px; border-radius: 12px;
    text-align: left; font-size: 14px; font-weight: 600; color: var(--text);
    cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .nav-btn:hover { background: #ffe5ec; }
  .nav-btn.active { background: var(--primary); color: #fff; }
  .backup-box { display: flex; gap: 6px; padding-top: 10px; border-top: 1px dashed #f3d5dc; }
  .btn-sm {
    padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: #fff; font-size: 12px; cursor: pointer; font-weight: 600; color: var(--text);
  }
  .main { flex: 1; padding: 20px; max-width: 1150px; overflow-x: hidden; }
  .topbar {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 16px; background: var(--card); padding: 12px 16px;
    border-radius: 16px; border: 1px solid var(--border);
  }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat-pill { padding: 5px 11px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .pill-pink { background: #ffe5ec; color: #c94a63; }
  .pill-blue { background: #e2f1ff; color: #3a7ca5; }
  .pill-mint { background: #e2f5ee; color: #2f7d65; }
  .pill-lav { background: #f2eaf7; color: #6d4c82; }
  .tab-section { display: none; }
  .tab-section.active { display: block; }
  .card {
    background: var(--card); border-radius: 16px; padding: 16px;
    border: 1px solid var(--border); margin-bottom: 16px;
  }
  .card h2 { font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  select, input, textarea {
    padding: 9px 11px; border-radius: 10px; border: 1px solid #e2d8ce;
    background: #fff; font-size: 14px; color: var(--text); width: 100%;
  }
  .btn {
    padding: 9px 15px; border-radius: 10px; border: none; background: var(--primary);
    color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; width: auto;
  }
  .btn-mint { background: #52b788; }
  .btn-blue { background: #5fa8d3; }
  .del-btn { background: #f8edeb; color: #b55d5d; border: none; padding: 5px 9px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .status-btn { padding: 5px 10px; border-radius: 8px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
  .list-item {
    padding: 12px; border-radius: 12px; border: 1px solid var(--border);
    background: #fffdfb; margin-bottom: 9px; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 10px; flex-wrap: wrap;
  }
  .list-item.done { opacity: 0.55; text-decoration: line-through; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; margin-right: 5px; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { padding: 5px 11px; border-radius: 16px; border: 1px solid #dfd5cb; background: #fff; font-size: 13px; cursor: pointer; }
  .chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
  .mobile-sync-bar { display: none; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

  @media (max-width: 768px) {
    .app-wrap { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: sticky; top: 0; z-index: 50; padding: 10px 12px; }
    .brand { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
    .brand-left { display: flex; align-items: center; gap: 8px; text-align: left; }
    .cookie-avatar { width: 36px; height: 36px; font-size: 18px; margin: 0; }
    .nav { flex-direction: row; overflow-x: auto; margin-top: 8px; padding-bottom: 4px; }
    .nav-btn { white-space: nowrap; padding: 7px 11px; font-size: 13px; }
    .backup-box { display: none; }
    .mobile-sync-bar { display: flex; }
    .main { padding: 12px; }
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-avatar">🐶</div>
    <h2 style="color:var(--primary-dark);font-size:21px;">DL English 教師工作台</h2>
    <p style="font-size:13px;color:var(--muted);margin-top:6px;">歡迎回來，Debra 老師！點擊下方按鈕一鍵進入</p>
    <div id="pinInputWrap" style="display:none;margin-top:14px;">
      <input type="password" id="loginPinInput" maxlength="4" placeholder="請輸入 4 位數 PIN 碼" style="text-align:center;letter-spacing:4px;font-size:16px;">
    </div>
    <button class="login-btn" onclick="quickLogin()">🐶 Debra 老師一鍵快速登入</button>
    <label style="display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--muted);cursor:pointer;">
      <input type="checkbox" id="rememberLogin" checked style="width:auto;"> 記住登入狀態（下次自動進入）
    </label>
  </div>
</div>

<div class="app-wrap">
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-left">
          <div class="cookie-avatar">🐶</div>
          <div>
            <h1>DL English</h1>
            <p>Cookie 教師工作台</p>
          </div>
        </div>
        <button class="btn-sm" onclick="lockWorkbench()">🔒 鎖定</button>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-tab="todos" onclick="switchTab('todos')">✅ 應做事項</button>
        <button class="nav-btn" data-tab="lessons" onclick="switchTab('lessons')">📖 教學內容</button>
        <button class="nav-btn" data-tab="homework" onclick="switchTab('homework')">📚 功課追蹤</button>
        <button class="nav-btn" data-tab="mistakes" onclick="switchTab('mistakes')">🎯 錯題追蹤</button>
        <button class="nav-btn" data-tab="exams" onclick="switchTab('exams')">📊 成績與補考</button>
        <button class="nav-btn" data-tab="fees" onclick="switchTab('fees')">💰 收費與補課</button>
        <button class="nav-btn" data-tab="games" onclick="switchTab('games')">🎮 遊戲與月報</button>
        <button class="nav-btn" data-tab="students" onclick="switchTab('students')">⚙️ 名單/安全</button>
      </nav>
    </div>
    <div class="backup-box">
      <button class="btn-sm" style="flex:1;" onclick="exportData()">📤 匯出備份</button>
      <button class="btn-sm" style="flex:1;" onclick="document.getElementById('importFile').click()">📥 匯入還原</button>
    </div>
  </aside>

  <main class="main">
    <div class="mobile-sync-bar">
      <button class="btn-sm" style="flex:1;background:#fff0f3;" onclick="exportData()">📤 匯出備份（同步用）</button>
      <button class="btn-sm" style="flex:1;background:#e2f5ee;" onclick="document.getElementById('importFile').click()">📥 匯入還原（同步用）</button>
      <button class="btn-sm" style="flex:1;background:#eef7ff;" onclick="pasteImportData()">📋 貼上還原</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json,text/plain,*/*" style="display:none" onchange="importData(event)">

    <div class="topbar">
      <div class="stats">
        <span class="stat-pill pill-pink" onclick="switchTab('todos')">待辦：<b id="statTodos">0</b></span>
        <span class="stat-pill pill-blue" onclick="switchTab('homework')">功課未完成：<b id="statHw">0</b></span>
        <span class="stat-pill pill-mint" onclick="switchTab('mistakes')">待出類似題：<b id="statMistakes">0</b></span>
        <span class="stat-pill pill-lav" onclick="switchTab('exams')">成績/考卷庫：<b id="statExams">0</b></span>
        <span class="stat-pill" style="background:#ffe8cc;color:#b85d00;" onclick="switchTab('exams')">待補考：<b id="statRetest">0</b></span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span style="font-size:13px;font-weight:600;white-space:nowrap;">🔍 班級：</span>
        <select id="globalClassFilter" onchange="renderAll()" style="width:auto;"></select>
      </div>
    </div>

    <!-- 1. 應做事項 -->
    <section id="tab-todos" class="tab-section active">
      <div class="card" style="border:2px solid var(--primary);background:#fff9fa;">
        <h2>
          <span>📅 今日焦點（今天要注意的事）</span>
          <span id="todayDateLabel" style="font-size:13px;color:var(--primary-dark);"></span>
        </h2>
        <div id="todayFocusList"></div>
      </div>
      <div class="card">
        <h2>✅ 新增應做事項</h2>
        <div class="grid-3">
          <input type="text" id="todoText" placeholder="例如：印製 Sunny 相關連接詞練習單...">
          <select id="todoTag">
            <option value="📄 印製教材/考卷">📄 印製教材/考卷</option>
            <option value="🎯 出錯題練習單">🎯 出錯題練習單</option>
            <option value="🎙️ 口說作業回饋">🎙️ 口說作業回饋</option>
            <option value="💬 家長溝通">💬 家長溝通</option>
          </select>
          <select id="todoTarget"></select>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
          <input type="date" id="todoDate" style="width:auto;">
          <button class="btn" onclick="addTodo()">＋ 加入待辦</button>
        </div>
      </div>
      <div class="card">
        <h2>📋 待辦任務清單</h2>
        <div id="todoList"></div>
      </div>
    </section>

    <!-- 2. 教學內容 -->
    <section id="tab-lessons" class="tab-section">
      <div class="card">
        <h2>📖 登錄課堂教學內容</h2>
        <div class="grid-3">
          <select id="lessonTarget"></select>
          <input type="date" id="lessonDate">
          <input type="text" id="lessonVersion" placeholder="版本/教材（如：翰林國三、GEPT初級）">
        </div>
        <div style="margin-top:10px;">
          <input type="text" id="lessonTopic" placeholder="教學單元 / 文法考點 / 使用遊戲">
        </div>
        <button class="btn" style="margin-top:10px;" onclick="addLesson()">＋ 儲存教學紀錄</button>
      </div>
      <div class="card">
        <h2>🗂️ 歷史教學紀錄</h2>
        <div id="lessonList"></div>
      </div>
    </section>

    <!-- 3. 功課追蹤 -->
    <section id="tab-homework" class="tab-section">
      <div class="card">
        <h2>📚 派發新功課</h2>
        <div id="hwClassQuickBtns" class="chip-group"></div>
        <div id="hwStudentChips" class="chip-group"></div>
        <div class="grid-2" style="margin-top:10px;">
          <input type="text" id="hwTitle" placeholder="功課內容（如：錄音15秒朗讀、單字遊戲Unit 3）">
          <select id="hwType">
            <option value="🎙️ 口說錄音">🎙️ 口說錄音</option>
            <option value="🎮 線上單字/文法遊戲">🎮 線上單字/文法遊戲</option>
            <option value="📝 文法/閱讀練習單">📝 文法/閱讀練習單</option>
            <option value="✍️ 考卷錯題訂正">✍️ 考卷錯題訂正</option>
          </select>
        </div>
        <div class="grid-2" style="margin-top:10px;">
          <label style="font-size:13px;font-weight:600;">🚀 開始時間：<input type="date" id="hwStart"></label>
          <label style="font-size:13px;font-weight:600;">⏰ 到期時間：<input type="date" id="hwDue"></label>
        </div>
        <button class="btn" style="margin-top:10px;" onclick="addHomework()">＋ 派發功課</button>
      </div>
      <div class="card">
        <h2>
          <span>📊 功課繳交追蹤</span>
          <button class="btn" style="background:#06c755;font-size:13px;" onclick="shareLineReport()">💬 缺交+成績補考傳 LINE</button>
        </h2>
        <div id="homeworkList"></div>
      </div>
    </section>

    <!--
