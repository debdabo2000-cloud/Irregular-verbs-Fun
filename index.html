<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DL English 萌寵英文單字特訓站</title>
    <style>
        :root {
            --bg-color: #FFF9F5;
            --card-bg: #FFFFFF;
            --primary: #E8A87C;
            --primary-dark: #D38E61;
            --accent: #FCE1E4;
            --text-main: #5C4A42;
            --text-light: #9E8A78;
            --success: #789E6E;
            --error: #E07A5F;
            --hint-bg: #FFF3CD;
            --hint-text: #856404;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(#FCE1E4 15%, transparent 16%), radial-gradient(#FCE1E4 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 12px 35px rgba(232, 168, 124, 0.15);
            padding: 28px;
            margin-top: 20px;
            border: 3px solid #FFEBE8;
        }

        .wallet-banner {
            background: #FFFDF9;
            border: 2px solid var(--primary);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .coin-badge {
            color: #D97706;
            background: #FEF3C7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .welcome-box {
            text-align: center;
            padding: 10px 0;
        }

        .welcome-box p {
            margin-bottom: 20px;
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .category-select {
            margin-bottom: 20px;
            text-align: left;
            background: #FFFDF9;
            padding: 14px;
            border-radius: 14px;
            border: 2px dashed var(--primary);
        }

        .category-select label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .category-select select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid var(--primary);
            border-radius: 12px;
            background: white;
            color: var(--text-main);
            outline: none;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 12px rgba(232, 168, 124, 0.4);
            margin-top: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .audio-btn, .hint-btn {
            flex: 1;
            color: white;
            border: none;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .audio-btn { background-color: #F4A261; }
        .audio-btn:hover { background-color: #E76F51; }

        .hint-btn { background-color: #E9C46A; color: #5C4A42; }
        .hint-btn:hover { background-color: #D4A373; }

        .hint-display {
            background-color: var(--hint-bg);
            color: var(--hint-text);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 14px;
            text-align: center;
            font-weight: bold;
            display: none;
            border: 1px solid #FFEEBA;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--text-light);
            background: #FFFDF9;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #FCE1E4;
        }

        .card-prompt {
            text-align: center;
            margin-bottom: 20px;
            background: #FFFDF9;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #FCE1E4;
        }

        .card-prompt .base-word {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 6px;
            word-break: break-all;
        }

        .card-prompt .chinese {
            font-size: 1rem;
            color: var(--text-light);
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1.1rem;
            border: 2px solid var(--primary);
            border-radius: 12px;
            outline: none;
            background: #FFFDF9;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-dark);
            background: white;
        }

        .feedback {
            text-align: center;
            font-weight: bold;
            min-height: 28px;
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .feedback.correct { color: var(--success); }
        .feedback.error { color: var(--error); }

        .result-stats {
            background: #FFFDF9;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            border: 2px dashed var(--primary);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-value {
            font-weight: bold;
            color: var(--text-main);
        }

        .wrong-list-box {
            margin-top: 15px;
            background: #FFF2F2;
            border: 2px solid #F5C6CB;
            border-radius: 12px;
            padding: 14px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
        }

        .wrong-list-title {
            font-weight: bold;
            color: #C82333;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .wrong-item {
            font-size: 0.9rem;
            color: #721C24;
            margin-bottom: 6px;
            border-bottom: 1px dashed #F5C6CB;
            padding-bottom: 4px;
        }

        .screenshot-hint {
            font-size: 0.9rem;
            color: var(--primary-dark);
            margin-top: 16px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 總積分橫幅 -->
        <div class="wallet-banner">
            <span>🐾 萌寵金庫存摺</span>
            <span class="coin-badge" id="total-coins">🪙 0 枚金幣</span>
        </div>

        <!-- 歡迎畫面 -->
        <div id="start-screen" class="screen active">
            <h1>🐾 DL English 萌寵單字特訓站 🐶</h1>
            <div class="subtitle">✨ 階層式選單：版本與課次自由切換 ✨</div>
            <div class="welcome-box">
                <div class="category-select">
                    <label for="main-select">🎯 第一層：請選擇教材大類：</label>
                    <select id="main-select" onchange="updateSubCategory()">
                        <option value="kangxuan">1. 康軒第一冊</option>
                        <option value="cap1200">2. 會考 1200</option>
                        <option value="irregular">3. 動詞三態</option>
                        <option value="vocab7000">4. 高中 7000 單</option>
                    </select>

                    <label for="sub-select" id="sub-label" style="margin-top: 12px;">📖 第二層：請選擇具體範圍：</label>
                    <select id="sub-select">
                        <!-- 動態載入 -->
                    </select>
                </div>
                <p>每關完全隨機亂數抽考 10 道題。<br>支援語音朗讀、智慧提示與錯題複習！</p>
                <button class="btn" onclick="startGame()">🚀 開始可愛大挑戰</button>
            </div>
        </div>

        <!-- 遊戲測驗畫面 -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <span id="progress-text">進度：1 / 10</span>
                <span id="timer-text">⏱️ 0 秒</span>
            </div>

            <div class="card-prompt">
                <div class="action-row">
                    <button class="audio-btn" onclick="speakCurrentWord()">🔊 聽發音</button>
                    <button class="hint-btn" onclick="showHintBox()">💡 看提示</button>
                </div>
                <div id="hint-text" class="hint-display">提示</div>
                <div class="chinese" id="chinese-top-label">請根據中文提示拼出英文：</div>
                <div class="base-word" id="base-word">吃</div>
            </div>

            <!-- 一般單字輸入區 (單一輸入框) -->
            <div id="single-input-area" class="input-group">
                <label for="single-input" id="single-label">請輸入英文單字拼寫：</label>
                <input type="text" id="single-input" placeholder="請輸入英文拼寫" autocomplete="off" autocapitalize="none">
            </div>

            <!-- 動詞三態專用輸入區 (雙輸入框：過去式與過去分詞) -->
            <div id="double-input-area" class="input-group" style="display:none;">
                <div style="margin-bottom: 12px;">
                    <label for="past-input">請輸入「過去式 (Past)」：</label>
                    <input type="text" id="past-input" placeholder="例如: ate" autocomplete="off" autocapitalize="none">
                </div>
                <div>
                    <label for="pp-input">請輸入「過去分詞 (Past Participle)」：</label>
                    <input type="text" id="pp-input" placeholder="例如: eaten" autocomplete="off" autocapitalize="none">
                </div>
            </div>

            <div class="feedback" id="feedback-msg"></div>

            <button class="btn" id="submit-btn" onclick="checkAnswer()">送出答案 ➔</button>
        </div>

        <!-- 結算畫面 (截圖區) -->
        <div id="result-screen" class="screen">
            <h1>🎉 太棒了！挑戰成功！ 🎉</h1>
            <div class="subtitle" id="result-category-title">單元特訓結束</div>
            
            <div class="result-stats">
                <div class="stat-item">
                    <span>測驗單元：</span>
                    <span class="stat-value" id="res-category">康軒第一冊 Lesson 1</span>
                </div>
                <div class="stat-item">
                    <span>本次獲得金幣：</span>
                    <span class="stat-value" id="res-coins" style="color: #D97706;">+0 枚 🪙</span>
                </div>
                <div class="stat-item">
                    <span>總花費時間：</span>
                    <span class="stat-value" id="res-time">0 秒</span>
                </div>
                <div class="stat-item">
                    <span>答對題數：</span>
                    <span class="stat-value" id="res-score">10 / 10</span>
                </div>
                <div class="stat-item">
                    <span>正確率：</span>
                    <span class="stat-value" id="res-accuracy">100%</span>
                </div>
            </div>

            <!-- 錯題清單展示區 -->
            <div id="wrong-container" style="display:none;" class="wrong-list-box">
                <div class="wrong-list-title">💡 本次需加強複習的錯題清單：</div>
                <div id="wrong-items-list"></div>
            </div>

            <button class="btn" onclick="backToHome()">🏠 返回首頁再玩一次</button>
            <div class="screenshot-hint">📸 請將此畫面截圖並傳給老師登記成績與金幣！</div>
        </div>
    </div>

        function updateSubCategory() {
            const mainSelect = document.getElementById('main-select').value;
            const subSelect = document.getElementById('sub-select');
            subSelect.innerHTML = '';

            if (mainSelect === 'kangxuan') {
                subSelect.innerHTML = `
                    <option value="kangxuan_u1">LESSON 1</option>
                    <option value="kangxuan_u2">LESSON 2</option>
                    <option value="kangxuan_u3">LESSON 3</option>
                    <option value="kangxuan_u4">LESSON 4</option>
                    <option value="kangxuan_u5">LESSON 5</option>
                    <option value="kangxuan_u6">LESSON 6</option>
                `;
            } else if (mainSelect === 'cap1200') {
                subSelect.innerHTML = `<option value="cap1200">國中會考 1200 核心單字</option>`;
            } else if (mainSelect === 'irregular') {
                subSelect.innerHTML = `<option value="irregular">不規則動詞三態特訓</option>`;
            } else if (mainSelect === 'vocab7000') {
                subSelect.innerHTML = `<option value="vocab7000">高中 7000 核心單字拼寫</option>`;
            }
        }

        window.onload = function() {
            updateSubCategory();
        };

        let currentCategory = 'kangxuan_u1';
        let currentQuestions = [];
        let wrongQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let earnedCoins = 0;
        let startTime = 0;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let isAnswering = false;

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startGame() {
            const mainSelect = document.getElementById('main-select').value;
            const subSelect = document.getElementById('sub-select');
            
            if (mainSelect === 'kangxuan') {
                currentCategory = subSelect.value;
            } else {
                currentCategory = mainSelect;
            }
            
            let rawData = db[currentCategory];
            let shuffled = shuffleArray(rawData);
            currentQuestions = shuffled.slice(0, 10);
            wrongQuestions = [];
            
            currentIndex = 0;
            score = 0;
            earnedCoins = 0;
            elapsedSeconds = 0;
            
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');

            startTimer();
            loadQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(() => {
                elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timer-text').innerText = `⏱️ ${elapsedSeconds} 秒`;
            }, 1000);
        }

        function loadQuestion() {
            isAnswering = false;
            const q = currentQuestions[currentIndex];
            document.getElementById('progress-text').innerText = `進度：${currentIndex + 1} / 10`;
            
            const singleInputArea = document.getElementById('single-input-area');
            const doubleInputArea = document.getElementById('double-input-area');
            const singleInput = document.getElementById('single-input');
            const pastInput = document.getElementById('past-input');
            const ppInput = document.getElementById('pp-input');
            const hintBox = document.getElementById('hint-text');

            singleInput.value = '';
            pastInput.value = '';
            ppInput.value = '';
            singleInput.disabled = false;
            pastInput.disabled = false;
            ppInput.disabled = false;
            hintBox.style.display = 'none';

            if (q.type === 'double') {
                singleInputArea.style.display = 'none';
                doubleInputArea.style.display = 'block';
                document.getElementById('chinese-top-label').innerText = "🐾 請根據原形動詞與中文填寫三態：";
                document.getElementById('base-word').innerText = `${q.base} (${q.cn})`;
                pastInput.focus();
            } else {
                singleInputArea.style.display = 'block';
                doubleInputArea.style.display = 'none';
                document.getElementById('chinese-top-label').innerText = "🐶 請根據中文提示拼出英文：";
                document.getElementById('base-word').innerText = q.cn;
                document.getElementById('single-label').innerText = "請輸入英文拼寫：";
                singleInput.focus();
            }

            document.getElementById('feedback-msg').innerText = '';
            document.getElementById('feedback-msg').className = 'feedback';
            document.getElementById('submit-btn').innerText = '送出答案 ➔';
        }

        function showHintBox() {
            const q = currentQuestions[currentIndex];
            const hintBox = document.getElementById('hint-text');
            if (q.type === 'double') {
                const firstLetter = q.past.charAt(0);
                hintBox.innerText = `💡 提示：過去式首字母為 [ ${firstLetter} ... ]`;
            } else {
                const target = q.word;
                const firstLetter = target.charAt(0);
                const len = target.length;
                hintBox.innerText = `💡 提示：首字母為 "${firstLetter}"，總共 ${len} 個字元`;
            }
            hintBox.style.display = 'block';
        }

        function speakCurrentWord() {
            const q = currentQuestions[currentIndex];
            let textToSpeak = "";
            if (q.type === 'double') {
                textToSpeak = `${q.base}, ${q.past}, ${q.pp}`;
            } else {
                textToSpeak = q.word;
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的瀏覽器不支援語音功能');
            }
        }

        function checkAnswer() {
            if (isAnswering) {
                currentIndex++;
                if (currentIndex < currentQuestions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
                return;
            }

            const q = currentQuestions[currentIndex];
            const msgEl = document.getElementById('feedback-msg');
            let isCorrect = false;

            if (q.type === 'double') {
                const userPast = document.getElementById('past-input').value.trim().toLowerCase();
                const userPp = document.getElementById('pp-input').value.trim().toLowerCase();

                if (!userPast || !userPp) {
                    alert('請完整填寫過去式與過去分詞！');
                    return;
                }

                const correctPastOptions = q.past.toLowerCase().split('/').map(s => s.trim());
                const correctPpOptions = q.pp.toLowerCase().split('/').map(s => s.trim());

                const isPastCorrect = correctPastOptions.includes(userPast);
                const isPpCorrect = correctPpOptions.includes(userPp);

                document.getElementById('past-input').disabled = true;
                document.getElementById('pp-input').disabled = true;

                if (isPastCorrect && isPpCorrect) {
                    isCorrect = true;
                } else {
                    msgEl.innerText = `❌ 正確答案：過去式 [ ${q.past} ]，過去分詞 [ ${q.pp} ]`;
                }
            } else {
                const userVal = document.getElementById('single-input').value.trim().toLowerCase();
                if (!userVal) {
                    alert('請輸入答案！');
                    return;
                }

                const targetVal = q.word.toLowerCase();
                document.getElementById('single-input').disabled = true;

                if (userVal === targetVal) {
                    isCorrect = true;
                } else {
                    msgEl.innerText = `❌ 正確答案是：${q.word}`;
                }
            }

            if (isCorrect) {
                score++;
                earnedCoins += 1;
                totalCoins += 1;
                updateCoinDisplay();
                msgEl.innerText = '✨ 太棒了！答對囉！ (+1 金幣 🪙)';
                msgEl.className = 'feedback correct';
            } else {
                wrongQuestions.push(q);
                msgEl.className = 'feedback error';
            }

            speakCurrentWord();

            isAnswering = true;
            document.getElementById('submit-btn').innerText = (currentIndex < currentQuestions.length - 1) ? '下一題 ➔' : '查看結算成績 ➔';
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');

            const categoryNames = {
                kangxuan_u1: "康軒第一冊 - LESSON 1",
                kangxuan_u2: "康軒第一冊 - LESSON 2",
                kangxuan_u3: "康軒第一冊 - LESSON 3",
                kangxuan_u4: "康軒第一冊 - LESSON 4",
                kangxuan_u5: "康軒第一冊 - LESSON 5",
                kangxuan_u6: "康軒第一冊 - LESSON 6",
                cap1200: "會考 1200 核心單字",
                irregular: "動詞三態特訓",
                vocab7000: "高中 7000 單拼寫"
            };

            document.getElementById('res-category').innerText = categoryNames[currentCategory];
            document.getElementById('result-category-title').innerText = `${categoryNames[currentCategory]} 結算`;
            document.getElementById('res-coins').innerText = `+${earnedCoins} 枚 🪙`;
            document.getElementById('res-time').innerText = `${elapsedSeconds} 秒`;
            document.getElementById('res-score').innerText = `${score} / 10`;
            document.getElementById('res-accuracy').innerText = `${Math.round((score / 10) * 100)}%`;

            const wrongContainer = document.getElementById('wrong-container');
            const wrongItemsList = document.getElementById('wrong-items-list');
            wrongItemsList.innerHTML = '';

            if (wrongQuestions.length > 0) {
                wrongContainer.style.display = 'block';
                wrongQuestions.forEach((q) => {
                    let itemDiv = document.createElement('div');
                    itemDiv.className = 'wrong-item';
                    if (q.type === 'double') {
                        itemDiv.innerHTML = `• <b>${q.base}</b> (${q.cn}) ➔ 過去式：${q.past}，過去分詞：${q.pp}`;
                    } else {
                        itemDiv.innerHTML = `• <b>${q.word}</b> (${q.cn})`;
                    }
                    wrongItemsList.appendChild(itemDiv);
                });
            } else {
                wrongContainer.style.display = 'none';
            }
        }

        function backToHome() {
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const gameActive = document.getElementById('game-screen').classList.contains('active');
                if (gameActive) {
                    checkAnswer();
                }
            }
        });
