<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DL's 單字搶救大作戰</title>
    <style>
        :root {
            --bg-color: #FFF9F5;
            --card-bg: #FFFFFF;
            --primary: #E8A87C;
            --primary-dark: #D38E61;
            --accent: #FCE1E4;
            --text-main: #5C4A42;
            --text-light: #9E8A78;
            --success: #789E6E;
            --error: #E07A5F;
            --hint-bg: #FFF3CD;
            --hint-text: #856404;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(#FCE1E4 15%, transparent 16%), radial-gradient(#FCE1E4 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 12px 35px rgba(232, 168, 124, 0.15);
            padding: 28px;
            margin-top: 20px;
            border: 3px solid #FFEBE8;
        }

        .wallet-banner {
            background: #FFFDF9;
            border: 2px solid var(--primary);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-main);
            flex-wrap: wrap;
            gap: 6px;
        }

        .coin-badges {
            display: flex;
            gap: 8px;
        }

        .coin-badge {
            color: #D97706;
            background: #FEF3C7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .ingot-badge {
            color: #B45309;
            background: #FDE68A;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .welcome-box {
            text-align: center;
            padding: 10px 0;
        }

        .welcome-box p {
            margin-bottom: 20px;
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .category-select {
            margin-bottom: 20px;
            text-align: left;
            background: #FFFDF9;
            padding: 14px;
            border-radius: 14px;
            border: 2px dashed var(--primary);
        }

        .category-select label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .category-select select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid var(--primary);
            border-radius: 12px;
            background: white;
            color: var(--text-main);
            outline: none;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 12px rgba(232, 168, 124, 0.4);
            margin-top: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .audio-btn, .hint-btn {
            flex: 1;
            color: white;
            border: none;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .audio-btn { background-color: #F4A261; }
        .audio-btn:hover { background-color: #E76F51; }

        .hint-btn { background-color: #E9C46A; color: #5C4A42; }
        .hint-btn:hover { background-color: #D4A373; }

        .hint-display {
            background-color: var(--hint-bg);
            color: var(--hint-text);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 14px;
            text-align: center;
            font-weight: bold;
            display: none;
            border: 1px solid #FFEEBA;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--text-light);
            background: #FFFDF9;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #FCE1E4;
        }

        .timer-badge {
            color: #C0392B;
            font-weight: bold;
            background: #FADBD8;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .card-prompt {
            text-align: center;
            margin-bottom: 20px;
            background: #FFFDF9;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #FCE1E4;
        }

        .card-prompt .base-word {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 6px;
            word-break: break-all;
        }

        .card-prompt .chinese {
            font-size: 1rem;
            color: var(--text-light);
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1.1rem;
            border: 2px solid var(--primary);
            border-radius: 12px;
            outline: none;
            background: #FFFDF9;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-dark);
            background: white;
        }

        .feedback {
            text-align: center;
            font-weight: bold;
            min-height: 28px;
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .feedback.correct { color: var(--success); }
        .feedback.error { color: var(--error); }

        .result-stats {
            background: #FFFDF9;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            border: 2px dashed var(--primary);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-value {
            font-weight: bold;
            color: var(--text-main);
        }

        .wrong-list-box {
            margin-top: 15px;
            background: #FFF2F2;
            border: 2px solid #F5C6CB;
            border-radius: 12px;
            padding: 14px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
        }

        .wrong-list-title {
            font-weight: bold;
            color: #C82333;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .wrong-item {
            font-size: 0.9rem;
            color: #721C24;
            margin-bottom: 6px;
            border-bottom: 1px dashed #F5C6CB;
            padding-bottom: 4px;
        }

        .screenshot-hint {
            font-size: 0.9rem;
            color: var(--primary-dark);
            margin-top: 16px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 總積分與金元寶存摺 -->
        <div class="wallet-banner">
            <span>🐾 萌寵金庫存摺</span>
            <div class="coin-badges">
                <span class="coin-badge" id="total-coins">🪙 0 枚金幣</span>
                <span class="ingot-badge" id="total-ingots">🟡 0 個金元寶</span>
            </div>
        </div>

        <!-- 歡迎畫面 -->
        <div id="start-screen" class="screen active">
            <h1>🐾 DL's 單字搶救大作戰 🐶</h1>
            <div class="subtitle">✨ 多版本教材與章節自由切換 ✨</div>
            <div class="welcome-box">
                <div class="category-select">
                    <label for="main-select">🎯 戰鬥選擇：</label>
                    <select id="main-select">
                        <option value="kx1">康軒版 第一冊</option>
                        <option value="kx3">康軒版 第三冊</option>
                        <option value="kx5">康軒版 第五冊</option>
                        <option value="hl3">翰林版 第三冊</option>
                        <option value="hl5">翰林版 第五冊</option>
                        <option value="nn5">南一版 第五冊</option>
                        <option value="lt3">龍騰版 高中第三冊 (L7-L9)</option>
                        <option value="irregular">不規則動詞三態特訓</option>
                        <option value="cap1200">國中會考 1200 核心單字 (全庫極限大亂洗)</option>
                        <option value="vocab7000">高中 7000 核心單字 (全庫極限大亂洗)</option>
                    </select>

                    <label for="sub-select" id="sub-label" style="margin-top: 12px; display: block; font-size: 0.9rem; color: var(--text-main); font-weight: bold;">📖 章節選擇：</label>
                    <select id="sub-select">
                        <!-- 動態生成選項 -->
                    </select>
                </div>
                <p>每關隨機亂數抽考 10 道題（每題限時 20 秒）。<br>支援語音朗讀、智慧提示與錯題複習！</p>
                <button class="btn" onclick="startGame()">🚀 開始單字大作戰</button>
            </div>
        </div>

        <!-- 遊戲測驗畫面 -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <span id="progress-text">進度：1 / 10</span>
                <span class="timer-badge" id="timer-text">⏱️ 20 秒</span>
            </div>

            <div class="card-prompt">
                <div class="action-row">
                    <button class="audio-btn" onclick="speakCurrentWord()">🔊 聽發音</button>
                    <button class="hint-btn" onclick="showHintBox()">💡 看提示</button>
                </div>
                <div id="hint-text" class="hint-display">提示</div>
                <div class="chinese" id="chinese-top-label">請根據中文提示拼出英文：</div>
                <div class="base-word" id="base-word">吃</div>
            </div>

            <!-- 一般單字輸入區 -->
            <div id="single-input-area" class="input-group">
                <label for="single-input" id="single-label">請輸入英文單字拼寫：</label>
                <input type="text" id="single-input" placeholder="請輸入英文拼寫" autocomplete="off" autocapitalize="none">
            </div>

            <!-- 動詞三態專用輸入區 -->
            <div id="double-input-area" class="input-group" style="display:none;">
                <div style="margin-bottom: 12px;">
                    <label for="past-input">請輸入「過去式 (Past)」：</label>
                    <input type="text" id="past-input" placeholder="例如: ate" autocomplete="off" autocapitalize="none">
                </div>
                <div>
                    <label for="pp-input">請輸入「過去分詞 (Past Participle)」：</label>
                    <input type="text" id="pp-input" placeholder="例如: eaten" autocomplete="off" autocapitalize="none">
                </div>
            </div>

            <div class="feedback" id="feedback-msg"></div>

            <button class="btn" id="submit-btn" onclick="checkAnswer()">送出答案 ➔</button>
        </div>

        <!-- 結算畫面 (截圖區) -->
        <div id="result-screen" class="screen">
            <h1>🎉 太棒了！挑戰成功！ 🎉</h1>
            <div class="subtitle" id="result-category-title">單元特訓結束</div>
            
            <div class="result-stats">
                <div class="stat-item">
                    <span>測驗章節：</span>
                    <span class="stat-value" id="res-category">康軒第一冊 Lesson 1</span>
                </div>
                <div class="stat-item">
                    <span>本次獲得金幣：</span>
                    <span class="stat-value" id="res-coins" style="color: #D97706;">+0 枚 🪙</span>
                </div>
                <div class="stat-item">
                    <span>答對題數：</span>
                    <span class="stat-value" id="res-score">10 / 10</span>
                </div>
                <div class="stat-item">
                    <span>正確率：</span>
                    <span class="stat-value" id="res-accuracy">100%</span>
                </div>
            </div>

            <!-- 錯題清單展示區 -->
            <div id="wrong-container" style="display:none;" class="wrong-list-box">
                <div class="wrong-list-title">💡 本次需加強複習的錯題清單：</div>
                <div id="wrong-items-list"></div>
            </div>

            <button class="btn" onclick="backToHome()">🏠 返回首頁再玩一次</button>
            <div class="screenshot-hint">📸 請將此畫面截圖並傳給老師登記成績與金幣！</div>
        </div>
    </div>
