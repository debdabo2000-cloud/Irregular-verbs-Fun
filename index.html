<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DL English 萌寵英文單字特訓站</title>
    <style>
        :root {
            --bg-color: #FFF9F5;
            --card-bg: #FFFFFF;
            --primary: #E8A87C;
            --primary-dark: #D38E61;
            --accent: #FCE1E4;
            --text-main: #5C4A42;
            --text-light: #9E8A78;
            --success: #789E6E;
            --error: #E07A5F;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(#FCE1E4 15%, transparent 16%), radial-gradient(#FCE1E4 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 12px 35px rgba(232, 168, 124, 0.15);
            padding: 28px;
            margin-top: 20px;
            border: 3px solid #FFEBE8;
        }

        .wallet-banner {
            background: #FFFDF9;
            border: 2px solid var(--primary);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .coin-badge {
            color: #D97706;
            background: #FEF3C7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        h1 {
            font-size: 1.35rem;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .welcome-box {
            text-align: center;
            padding: 10px 0;
        }

        .welcome-box p {
            margin-bottom: 20px;
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .category-select {
            margin-bottom: 20px;
            text-align: left;
            background: #FFFDF9;
            padding: 14px;
            border-radius: 14px;
            border: 2px dashed var(--primary);
        }

        .category-select label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .category-select select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid var(--primary);
            border-radius: 12px;
            background: white;
            color: var(--text-main);
            outline: none;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 12px rgba(232, 168, 124, 0.4);
            margin-top: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .audio-btn {
            background-color: #F4A261;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(244, 162, 97, 0.3);
        }

        .audio-btn:hover {
            background-color: #E76F51;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--text-light);
            background: #FFFDF9;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #FCE1E4;
        }

        .card-prompt {
            text-align: center;
            margin-bottom: 20px;
            background: #FFFDF9;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #FCE1E4;
        }

        .card-prompt .base-word {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 6px;
            word-break: break-all;
        }

        .card-prompt .chinese {
            font-size: 1rem;
            color: var(--text-light);
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1.1rem;
            border: 2px solid var(--primary);
            border-radius: 12px;
            outline: none;
            background: #FFFDF9;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-dark);
            background: white;
        }

        .feedback {
            text-align: center;
            font-weight: bold;
            min-height: 28px;
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .feedback.correct { color: var(--success); }
        .feedback.error { color: var(--error); }

        .result-stats {
            background: #FFFDF9;
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            border: 2px dashed var(--primary);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-value {
            font-weight: bold;
            color: var(--text-main);
        }

        .wrong-list-box {
            margin-top: 15px;
            background: #FFF2F2;
            border: 2px solid #F5C6CB;
            border-radius: 12px;
            padding: 14px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
        }

        .wrong-list-title {
            font-weight: bold;
            color: #C82333;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .wrong-item {
            font-size: 0.9rem;
            color: #721C24;
            margin-bottom: 6px;
            border-bottom: 1px dashed #F5C6CB;
            padding-bottom: 4px;
        }

        .screenshot-hint {
            font-size: 0.9rem;
            color: var(--primary-dark);
            margin-top: 16px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 總積分橫幅 -->
        <div class="wallet-banner">
            <span>🐾 萌寵金庫存摺</span>
            <span class="coin-badge" id="total-coins">🪙 0 枚金幣</span>
        </div>

        <!-- 歡迎畫面 -->
        <div id="start-screen" class="screen active">
            <h1>🐾 DL English 萌寵單字特訓站 🐶</h1>
            <div class="subtitle">✨ 真正隨機亂數出題 ＋ 語音朗讀 ✨</div>
            <div class="welcome-box">
                <div class="category-select">
                    <label for="category-select">🎯 請選擇今日挑戰單元：</label>
                    <select id="category-select">
                        <option value="irregular">不規則動詞三態特訓</option>
                        <option value="cap1200">國中會考 1200 核心單字拼寫</option>
                        <option value="vocab7000">高中 7000 核心單字拼寫</option>
                        <option value="collocations">高級搭配詞與慣用語拼寫</option>
                    </select>
                </div>
                <p>每關完全隨機抽考 10 道題。<br>附有真人發音朗讀與錯題複習清單！</p>
                <button class="btn" onclick="startGame()">🚀 開始可愛大挑戰</button>
            </div>
        </div>

        <!-- 遊戲測驗畫面 -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <span id="progress-text">進度：1 / 10</span>
                <span id="timer-text">⏱️ 0 秒</span>
            </div>

            <div class="card-prompt">
                <button class="audio-btn" onclick="speakCurrentWord()">🔊 聽發音</button>
                <div class="chinese" id="chinese-top-label">請根據中文提示拼出英文：</div>
                <div class="base-word" id="base-word">吃</div>
            </div>

            <div id="single-input-area" class="input-group" style="display:none;">
                <label for="single-input" id="single-label">請輸入英文單字拼寫：</label>
                <input type="text" id="single-input" placeholder="請輸入英文拼寫" autocomplete="off" autocapitalize="none">
            </div>

            <div id="double-input-area">
                <div class="input-group">
                    <label for="past-input">請輸入「過去式 (Past)」：</label>
                    <input type="text" id="past-input" placeholder="例如: ate" autocomplete="off" autocapitalize="none">
                </div>

                <div class="input-group">
                    <label for="pp-input">請輸入「過去分詞 (Past Participle)」：</label>
                    <input type="text" id="pp-input" placeholder="例如: eaten" autocomplete="off" autocapitalize="none">
                </div>
            </div>

            <div class="feedback" id="feedback-msg"></div>

            <button class="btn" id="submit-btn" onclick="checkAnswer()">送出答案 ➔</button>
        </div>

        <!-- 結算畫面 (截圖區) -->
        <div id="result-screen" class="screen">
            <h1>🎉 太棒了！挑戰成功！ 🎉</h1>
            <div class="subtitle" id="result-category-title">單元特訓結束</div>
            
            <div class="result-stats">
                <div class="stat-item">
                    <span>測驗單元：</span>
                    <span class="stat-value" id="res-category">不規則動詞三態</span>
                </div>
                <div class="stat-item">
                    <span>本次獲得金幣：</span>
                    <span class="stat-value" id="res-coins" style="color: #D97706;">+0 枚 🪙</span>
                </div>
                <div class="stat-item">
                    <span>總花費時間：</span>
                    <span class="stat-value" id="res-time">0 秒</span>
                </div>
                <div class="stat-item">
                    <span>答對題數：</span>
                    <span class="stat-value" id="res-score">10 / 10</span>
                </div>
                <div class="stat-item">
                    <span>正確率：</span>
                    <span class="stat-value" id="res-accuracy">100%</span>
                </div>
            </div>

            <!-- 錯題清單展示區 -->
            <div id="wrong-container" style="display:none;" class="wrong-list-box">
                <div class="wrong-list-title">💡 本次需加強複習的錯題清單：</div>
                <div id="wrong-items-list"></div>
            </div>

            <button class="btn" onclick="backToHome()">🏠 返回首頁再玩一次</button>
            <div class="screenshot-hint">📸 請將此畫面截圖並傳給老師登記成績與金幣！</div>
        </div>
    </div>
