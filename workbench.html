<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DL English 教師工作台</title>
<style>
  :root {
    --bg: #fdfaf6;
    --sidebar: #fff5f7;
    --card: #ffffff;
    --primary: #ff8fa3;
    --primary-dark: #e06c82;
    --secondary: #a2d2ff;
    --mint: #b8e0d2;
    --lavender: #cdb4db;
    --peach: #ffd6a5;
    --text: #4a4238;
    --muted: #8c8275;
    --border: #f0e6dc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 240px; background: var(--sidebar); border-right: 2px solid var(--border);
    padding: 20px 14px; display: flex; flex-direction: column; justify-content: space-between;
    position: sticky; top: 0; height: 100vh; flex-shrink: 0;
  }
  .brand { text-align: center; padding-bottom: 16px; border-bottom: 1px dashed #f3d5dc; }
  .cookie-avatar {
    width: 64px; height: 64px; border-radius: 50%; background: #fff0d6;
    margin: 0 auto 8px; display: flex; align-items: center; justify-content: center;
    font-size: 32px; border: 3px solid var(--primary); box-shadow: 0 3px 8px rgba(255,143,163,0.2);
  }
  .brand h1 { font-size: 17px; color: var(--primary-dark); letter-spacing: 0.5px; }
  .brand p { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .nav { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .nav-btn {
    border: none; background: transparent; padding: 11px 14px; border-radius: 12px;
    text-align: left; font-size: 14px; font-weight: 600; color: var(--text);
    cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s;
  }
  .nav-btn:hover { background: #ffe5ec; }
  .nav-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(255,143,163,0.35); }
  .nav-divider { height: 1px; background: #f3d5dc; margin: 8px 0; }

  .backup-box { display: flex; gap: 6px; padding-top: 12px; border-top: 1px dashed #f3d5dc; }
  .btn-sm {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border);
    background: #fff; font-size: 12px; cursor: pointer; font-weight: 600; color: var(--text);
    white-space: nowrap;
  }
  .btn-sm:hover { background: #fff0f3; }

  /* Main */
  .main { flex: 1; padding: 22px 26px; overflow-y: auto; max-width: 1200px; }
  .topbar {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 20px; background: var(--card); padding: 14px 18px;
    border-radius: 16px; border: 1px solid var(--border);
  }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; }
  .stat-pill {
    padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid transparent;
  }
  .pill-pink { background: #ffe5ec; color: #c94a63; }
  .pill-blue { background: #e2f1ff; color: #3a7ca5; }
  .pill-mint { background: #e2f5ee; color: #2f7d65; }
  .pill-lav { background: #f2eaf7; color: #6d4c82; }

  .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input, textarea {
    padding: 9px 12px; border-radius: 10px; border: 1px solid #e2d8ce;
    background: #fff; font-size: 14px; color: var(--text);
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--primary); }

  .btn {
    padding: 9px 16px; border-radius: 10px; border: none; background: var(--primary);
    color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn-outline { background: #fff; color: var(--primary-dark); border: 1.5px solid var(--primary); }
  .btn-outline:hover { background: #fff0f3; }
  .btn-mint { background: #52b788; }
  .btn-blue { background: #5fa8d3; }

  .tab-section { display: none; }
  .tab-section.active { display: block; }

  .card {
    background: var(--card); border-radius: 16px; padding: 18px;
    border: 1px solid var(--border); margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }
  .card h2 { font-size: 17px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }

  .list-item {
    padding: 13px 15px; border-radius: 12px; border: 1px solid var(--border);
    background: #fffdfb; margin-bottom: 10px; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 12px; flex-wrap: wrap;
  }
  .list-item.done { opacity: 0.6; text-decoration: line-through; }
  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 8px; font-size: 12px;
    font-weight: 600; margin-right: 6px; margin-bottom: 4px;
  }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip {
    padding: 5px 11px; border-radius: 16px; border: 1px solid #dfd5cb;
    background: #fff; font-size: 13px; cursor: pointer; user-select: none;
  }
  .chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }

  .del-btn {
    background: #f8edeb; color: #b55d5d; border: none; padding: 5px 10px;
    border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  .status-btn {
    padding: 5px 11px; border-radius: 8px; border: none; font-size: 12px;
    font-weight: 600; cursor: pointer;
  }
  .exam-img-preview {
    max-width: 100%; max-height: 220px; border-radius: 10px;
    border: 1px solid var(--border); margin-top: 8px; object-fit: contain; background: #faf7f2;
  }
  .idea-box {
    background: #fff9fb; border: 1px dashed #f3b8c6; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.6;
  }
  .transfer-box {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: #f7fbf9; border: 1px solid #cde5da;
  }

  /* Responsive Mobile Bar */
  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto; position: sticky; top: 0; z-index: 50;
      padding: 10px 12px; flex-direction: column;
    }
    .brand { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
    .cookie-avatar { width: 38px; height: 38px; font-size: 20px; margin: 0 8px 0 0; }
    .brand-left { display: flex; align-items: center; text-align: left; }
    .nav { flex-direction: row; overflow-x: auto; margin-top: 8px; padding-bottom: 4px; }
    .nav-btn { white-space: nowrap; padding: 8px 12px; font-size: 13px; }
    .nav-divider { display: none; }
    .backup-box { display: none; }
    .main { padding: 14px; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div>
    <div class="brand">
      <div class="brand-left">
        <div class="cookie-avatar">🐶</div>
        <div>
          <h1>DL English</h1>
          <p>Cookie 教師工作台</p>
        </div>
      </div>
      <button class="btn btn-outline" style="padding:6px 10px;font-size:12px;" onclick="switchTab('students')">⚙️ 班級/學生</button>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-tab="todos" onclick="switchTab('todos')">✅ 應做事項</button>
      <button class="nav-btn" data-tab="lessons" onclick="switchTab('lessons')">📖 教學內容</button>
      <button class="nav-btn" data-tab="homework" onclick="switchTab('homework')">📚 功課追蹤</button>
      <button class="nav-btn" data-tab="mistakes" onclick="switchTab('mistakes')">🎯 錯題追蹤</button>
      <button class="nav-btn" data-tab="exams" onclick="switchTab('exams')">💡 New Idea 考卷庫</button>
      <button class="nav-btn" data-tab="plans" onclick="switchTab('plans')">🗓️ 之後安排</button>
      <div class="nav-divider"></div>
      <button class="nav-btn" data-tab="students" onclick="switchTab('students')">🐾 學生名單設置</button>
    </nav>
  </div>
  <div class="backup-box">
    <button class="btn-sm" onclick="exportData()">📤 匯出備份</button>
    <button class="btn-sm" onclick="document.getElementById('importFile').click()">📥 匯入還原</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="stats">
      <span class="stat-pill pill-pink" onclick="switchTab('todos')">待辦：<b id="statTodos">0</b></span>
      <span class="stat-pill pill-blue" onclick="switchTab('homework')">功課未完成：<b id="statHw">0</b></span>
      <span class="stat-pill pill-mint" onclick="switchTab('mistakes')">待出類似題：<b id="statMistakes">0</b></span>
      <span class="stat-pill pill-lav" onclick="switchTab('exams')">考卷庫：<b id="statExams">0</b></span>
    </div>
    <div class="filter-bar">
      <label style="font-size:13px;font-weight:600;">🔍 篩選班級：</label>
      <select id="globalClassFilter" onchange="renderAll()">
        <option value="ALL">全部班級與家教</option>
      </select>
    </div>
  </div>

  <!-- 1. 應做事項 -->
  <section id="tab-todos" class="tab-section active">
    <div class="card">
      <h2>✅ 新增應做事項</h2>
      <div class="grid-3">
        <input type="text" id="todoText" placeholder="例如：印製 Sunny 相關連接詞練習單...">
        <select id="todoTag">
          <option value="📄 印製教材/考卷">📄 印製教材/考卷</option>
          <option value="🎯 出錯題練習單">🎯 出錯題練習單</option>
          <option value="🎙️ 口說作業回饋">🎙️ 口說作業回饋</option>
          <option value="💬 家長溝通">💬 家長溝通</option>
          <option value="📌 其他事項">📌 其他事項</option>
        </select>
        <select id="todoTarget"></select>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
        <input type="date" id="todoDate">
        <button class="btn" onclick="addTodo()">＋ 加入待辦</button>
      </div>
    </div>
    <div class="card">
      <h2>📋 待辦任務清單</h2>
      <div id="todoList"></div>
    </div>
  </section>

  <!-- 2. 教學內容 -->
  <section id="tab-lessons" class="tab-section">
    <div class="card">
      <h2>🔍 防重複教學查詢器（輸入考點或教材關鍵字）</h2>
      <input type="text" id="repeatSearch" style="width:100%;" placeholder="輸入例如：名詞子句、either...or、單字搶救大作戰..." oninput="renderLessons()">
      <div id="repeatResult" class="grid-2" style="margin-top:12px;"></div>
    </div>

    <div class="card">
      <h2>📖 登錄課堂教學內容</h2>
      <div class="grid-3">
        <select id="lessonTarget"></select>
        <input type="date" id="lessonDate">
        <input type="text" id="lessonVersion" placeholder="版本/教材（如：翰林國三、GEPT初級）">
      </div>
      <div style="margin-top:10px;">
        <input type="text" id="lessonTopic" style="width:100%;" placeholder="教學單元 / 文法考點 / 使用遊戲（必填）">
      </div>
      <div style="margin-top:10px;">
        <textarea id="lessonNote" rows="2" style="width:100%;" placeholder="課堂表現與補充筆記..."></textarea>
      </div>
      <button class="btn" style="margin-top:10px;" onclick="addLesson()">＋ 儲存教學紀錄</button>
    </div>

    <div class="card">
      <h2>🗂️ 歷史教學紀錄</h2>
      <div id="lessonList"></div>
    </div>
  </section>

  <!-- 3. 功課追蹤 -->
  <section id="tab-homework" class="tab-section">
    <div class="card">
      <h2>📚 派發新功課（支援單人或整班一鍵選取）</h2>
      <div style="margin-bottom:8px;font-size:13px;font-weight:600;">⚡ 快速選取整班或全選：</div>
      <div id="hwClassQuickBtns" class="chip-group"></div>
      <div style="margin-bottom:6px;font-size:13px;font-weight:600;">👤 點選學生（可複選）：</div>
      <div id="hwStudentChips" class="chip-group"></div>

      <div class="grid-3" style="margin-top:10px;">
        <input type="text" id="hwTitle" placeholder="功課內容（如：錄音15秒朗讀、單字遊戲Unit 3）">
        <select id="hwType">
          <option value="🎙️ 口說錄音">🎙️ 口說錄音</option>
          <option value="🎮 線上單字/文法遊戲">🎮 線上單字/文法遊戲</option>
          <option value="📝 文法/閱讀練習單">📝 文法/閱讀練習單</option>
          <option value="✍️ 考卷錯題訂正">✍️ 考
