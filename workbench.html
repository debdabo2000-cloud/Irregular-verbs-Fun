<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DL English 教師工作台</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #0ea5e9;
      --ok: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;
      --border: #e5e7eb;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .badge {
      font-size: 0.75rem;
      background: #dbeafe;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, select, input, textarea {
      font-family: inherit;
      font-size: 0.95rem;
    }

    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.15s ease;
    }

    button:hover { background: #f3f4f6; }

    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.primary:hover { background: var(--primary-hover); }

    button.danger {
      color: var(--danger);
      border-color: #fecaca;
      background: #fef2f2;
    }

    button.danger:hover { background: #fee2e2; }

    main {
      max-width: 1120px;
      margin: 18px auto 48px;
      padding: 0 16px;
    }

    .class-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    select, input[type="text"], input[type="number"], input[type="date"], textarea {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .panel.active { display: block; }

    h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .list-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: #fafbfd;
    }

    .done {
      text-decoration: line-through;
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.92rem;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 6px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-weight: 700;
      background: #f9fafb;
    }

    .table-wrap { overflow-x: auto; }

    .summary-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 12px;
      font-weight: 600;
    }

    .line-output {
      width: 100%;
      min-height: 170px;
      margin-top: 10px;
      font-size: 0.92rem;
    }

    /* Modal for Paste Restore / Lock */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .muted { color: var(--muted); font-size: 0.88rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span>🐾 DL English 教師工作台</span>
        <span class="badge">手機／桌機同步版</span>
      </div>
      <div class="toolbar">
        <button id="btnExportJson" type="button">💾 匯出 JSON</button>
        <button id="btnOpenRestore" type="button">📋 貼上還原</button>
        <button id="btnLockToggle" type="button">🔒 鎖定／密碼</button>
      </div>
    </div>
  </header>

  <main>
    <div class="class-bar">
      <label for="classSelect"><strong>目前班級：</strong></label>
      <select id="classSelect"></select>
      <input id="newClassName" type="text" placeholder="新班級名稱（例：國小高年級 A 班）" />
      <button id="btnAddClass" class="primary" type="button">新增班級</button>
      <button id="btnDeleteClass" class="danger" type="button">刪除目前班級</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="todo" type="button">應做事項／作業</button>
      <button class="tab-btn" data-tab="students" type="button">學生名冊與收費</button>
      <button class="tab-btn" data-tab="records" type="button">教學與成績／補考</button>
      <button class="tab-btn" data-tab="report" type="button">LINE 回報產生器</button>
    </div>

    <!-- Tab 1: Todos & Homework -->
    <section id="panel-todo" class="panel active">
      <h2>應做事項與作業追蹤</h2>
      <div class="form-row">
        <input id="todoTitle" type="text" placeholder="輸入待辦事項或作業內容..." style="flex: 1; min-width: 200px;" />
        <input id="todoDue" type="date" />
        <button id="btnAddTodo" class="primary" type="button">新增項目</button>
      </div>
      <div id="todoList"></div>
    </section>

    <!-- Tab 2: Students & Fee Calculation -->
    <section id="panel-students" class="panel">
      <h2>學生名冊與收費計算</h2>
      <div class="form-row">
        <input id="stuName" type="text" placeholder="學生姓名" />
        <input id="stuRate" type="number" min="0" step="50" placeholder="單堂／月費金額 (元)" />
        <input id="stuSessions" type="number" min="0" step="1" placeholder="堂數／期數" />
        <input id="stuDiscount" type="number" min="0" step="10" placeholder="折讓／優惠 (元)" />
        <button id="btnAddStudent" class="primary" type="button">新增學生</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>單價</th>
              <th>堂數</th>
              <th>折讓</th>
              <th>應收金額</th>
              <th>已繳</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
      <div id="feeSummary" class="summary-box"></div>
    </section>

    <!-- Tab 3: Teaching Log, Mistakes, Exams & Retests -->
    <section id="panel-records" class="panel">
      <h2>教學紀錄、錯題與考試／補考追蹤</h2>
      <div class="grid-2">
        <div>
          <h3 style="margin: 0 0 8px; font-size: 1rem;">課堂／錯題紀錄</h3>
          <div class="form-row">
            <input id="logDate" type="date" />
            <input id="logTopic" type="text" placeholder="單元／文法或單字重點" style="flex: 1;" />
          </div>
          <div class="form-row">
            <input id="logMistake" type="text" placeholder="常見錯題或需加強提醒" style="flex: 1;" />
            <button id="btnAddLog" class="primary" type="button">儲存紀錄</button>
          </div>
          <div id="logList"></div>
        </div>

        <div>
          <h3 style="margin: 0 0 8px; font-size: 1rem;">考試與補考紀錄</h3>
          <div class="form-row">
            <input id="examStu" type="text" placeholder="學生姓名" />
            <input id="examName" type="text" placeholder="測驗名稱（例：U1 單字測驗）" />
          </div>
          <div class="form-row">
            <input id="examScore" type="number" min="0" max="100" placeholder="初考分數" />
            <input id="examRetest" type="text" placeholder="補考分數／狀態" />
            <button id="btnAddExam" class="primary" type="button">新增成績</button>
          </div>
          <div id="examList"></div>
        </div>
      </div>
    </section>

    <!-- Tab 4: LINE Report Generator -->
    <section id="panel-report" class="panel">
      <h2>LINE 課後／月報回報產生器</h2>
      <div class="form-row">
        <button id="btnGenerateReport" class="primary" type="button">✨ 產生目前班級回報文字</button>
        <button id="btnCopyReport" type="button">📋 複製回報文字</button>
      </div>
      <textarea id="reportOutput" class="line-output" placeholder="點選上方按鈕產生回報內容..."></textarea>
    </section>
  </main>

  <!-- Paste Restore Modal -->
  <div id="restoreModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <h2 style="margin-top: 0;">📋 貼上 JSON 還原資料</h2>
      <p class="muted">請將先前匯出或複製的 JSON 資料貼入下方並按「確認還原」，目前瀏覽器資料將被覆蓋。</p>
      <textarea id="restoreTextarea" style="width: 100%; min-height: 180px;" placeholder='{"classes":[...]}'></textarea>
      <div class="form-row" style="justify-content: flex-end; margin-top: 12px; margin-bottom: 0;">
        <button id="btnCancelRestore" type="button">取消</button>
        <button id="btnConfirmRestore" class="primary" type="button">確認還原</button>
      </div>
    </div>
  </div>

  <!-- Lock / Password Modal -->
  <div id="lockModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <h2 id="lockModalTitle" style="margin-top: 0;">🔒 工作台密碼設定／解鎖</h2>
      <p id="lockModalDesc" class="muted">可設定登入密碼保護工作台；若尚未設定密碼，輸入新密碼即可啟用。</p>
      <input id="lockPasswordInput" type="password" placeholder="輸入密碼" style="width: 100%; margin-bottom: 12px;" />
      <div class="form-row" style="justify-content: flex-end; margin-bottom: 0;">
        <button id="btnClearPassword" class="danger" type="button">清除密碼</button>
        <button id="btnCancelLock" type="button">關閉</button>
        <button id="btnSubmitLock" class="primary" type="button">確認</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "dl_english_workbench_v1";
    const PASS_KEY = "dl_english_workbench_pass_v1";
    let isLockedSession = false;

    const defaultState = {
      activeClassId: "class-1",
      classes: [
        {
          id: "class-1",
          name: "示範班級（國小英文）",
          todos: [
            { id: "t1", title: "批改本週單字聽寫與作業", due: "", done: false }
          ],
          students: [
            { id: "s1", name: "王小明", rate: 600, sessions: 4, discount: 0, paid: true }
          ],
          logs: [
            { id: "l1", date: "", topic: "現在簡單式第三人稱單數 -s", mistake: "忘記在動詞後加 -s" }
          ],
          exams: [
            { id: "e1", student: "王小明", exam: "單字小考", score: 85, retest: "免補考" }
          ]
        }
      ]
    };

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.classes) || parsed.classes.length === 0) {
          return structuredClone(defaultState);
        }
        return parsed;
      } catch {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getCurrentClass() {
      return state.classes.find((c) => c.id === state.activeClassId) || state.classes[0];
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderAll() {
      const classSelect = document.getElementById("classSelect");
      classSelect.innerHTML = state.classes
        .map((c) => `<option value="${escapeHtml(c.id)}" ${c.id === getCurrentClass().id ? "selected" : ""}>${escapeHtml(c.name)}</option>`)
        .join("");

      const cls = getCurrentClass();
      renderTodos(cls);
      renderStudents(cls);
      renderLogs(cls);
      renderExams(cls);
      saveState();
    }

    function renderTodos(cls) {
      const el = document.getElementById("todoList");
      if (!cls.todos.length) {
        el.innerHTML = `<p class="muted">目前沒有應做事項。</p>`;
        return;
      }
      el.innerHTML = cls.todos
        .map((t) => `
          <div class="list-item">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1;">
              <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTodo('${t.id}')" />
              <span class="${t.done ? "done" : ""}">${escapeHtml(t.title)}</span>
              ${t.due ? `<span class="muted">（期限：${escapeHtml(t.due)}）</span>` : ""}
            </label>
            <button class="danger" type="button" onclick="deleteTodo('${t.id}')">刪除</button>
          </div>
        `)
        .join("");
    }

    function renderStudents(cls) {
      const tbody = document.getElementById("studentTableBody");
      let totalReceivable = 0;
      let totalPaid = 0;

      tbody.innerHTML = cls.students
        .map((s) => {
          const amount = Math.max(0, (Number(s.rate) || 0) * (Number(s.sessions) || 0) - (Number(s.discount) || 0));
          totalReceivable += amount;
          if (s.paid) totalPaid += amount;
          return `
            <tr>
              <td>${escapeHtml(s.name)}</td>
              <td>$${Number(s.rate) || 0}</td>
              <td>${Number(s.sessions) || 0}</td>
              <td>-$${Number(s.discount) || 0}</td>
              <td><strong>$${amount}</strong></td>
              <td>
                <input type="checkbox" ${s.paid ? "checked" : ""} onchange="togglePaid('${s.id}')" />
                <span>${s.paid ? "已繳" : "未繳"}</span>
              </td>
              <td><button class="danger" type="button" onclick="deleteStudent('${s.id}')">移除</button></td>
            </tr>
          `;
        })
        .join("");

      document.getElementById("feeSummary").textContent =
        `本班應收總計：$${totalReceivable}｜已收金額：$${totalPaid}｜待收金額：$${Math.max(0, totalReceivable - totalPaid)}`;
    }

    function renderLogs(cls) {
      const el = document.getElementById("logList");
      if (!cls.logs.length) {
        el.innerHTML = `<p class="muted">尚無教學或錯題紀錄。</p>`;
        return;
      }
      el.innerHTML = cls.logs
        .map((l) => `
          <div class="list-item">
            <div>
              <div><strong>${escapeHtml(l.topic || "未填單元")}</strong> ${l.date ? `<span class="muted">(${escapeHtml(l.date)})</span>` : ""}</div>
              ${l.mistake ? `<div class="muted">錯題／提醒：${escapeHtml(l.mistake)}</div>` : ""}
            </div>
            <button class="danger" type="button" onclick="deleteLog('${l.id}')">刪除</button>
          </div>
        `)
        .join("");
    }

    function renderExams(cls) {
      const el = document.getElementById("examList");
      if (!cls.exams.length) {
        el.innerHTML = `<p class="muted">尚無考試或補考紀錄。</p>`;
        return;
      }
      el.innerHTML = cls.exams
        .map((e) => `
          <div class="list-item">
            <div>
              <strong>${escapeHtml(e.student)}</strong> — ${escapeHtml(e.exam)}：<strong>${escapeHtml(e.score)} 分</strong>
              <span class="muted">（補考：${escapeHtml(e.retest || "無")}）</span>
            </div>
            <button class="danger" type="button" onclick="deleteExam('${e.id}')">刪除</button>
          </div>
        `)
        .join("");
    }

    // Class handlers
    document.getElementById("classSelect").addEventListener("change", (e) => {
      state.activeClassId = e.target.value;
      renderAll();
    });

    document.getElementById("btnAddClass").addEventListener("click", () => {
      const input = document.getElementById("newClassName");
      const name = input.value.trim();
      if (!name) return;
      const newCls = {
        id: "class-" + Date.now(),
        name,
        todos: [],
        students: [],
        logs: [],
        exams: []
      };
      state.classes.push(newCls);
      state.activeClassId = newCls.id;
      input.value = "";
      renderAll();
    });

    document.getElementById("btnDeleteClass").addEventListener("click", () => {
      if (state.classes.length <= 1) {
        alert("至少需保留一個班級。");
        return;
      }
      const cls = getCurrentClass();
      if (!confirm(`確定要刪除「${cls.name}」嗎？`)) return;
      state.classes = state.classes.filter((c) => c.id !== cls.id);
      state.activeClassId = state.classes[0].id;
      renderAll();
    });

    // Tab switching
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      });
    });

    // Todo actions
    document.getElementById("btnAddTodo").addEventListener("click", () => {
      const titleEl = document.getElementById("todoTitle");
      const dueEl = document.getElementById("todoDue");
      if (!titleEl.value.trim()) return;
      getCurrentClass().todos.unshift({
        id: "t-" + Date.now(),
        title: titleEl.value.trim(),
        due: dueEl.value,
        done: false
      });
      titleEl.value = "";
      dueEl.value = "";
      renderAll();
    });

    window.toggleTodo = (id) => {
      const item = getCurrentClass().todos.find((t) => t.id === id);
      if (item) { item.done = !item.done; renderAll(); }
    };

    window.deleteTodo = (id) => {
      const cls = getCurrentClass();
      cls.todos = cls.todos.filter((t) => t.id !== id);
      renderAll();
    };

    // Student & fee actions
    document.getElementById("btnAddStudent").addEventListener("click", () => {
      const nameEl = document.getElementById("stuName");
      const rateEl = document.getElementById("stuRate");
      const sessEl = document.getElementById("stuSessions");
      const discEl = document.getElementById("stuDiscount");
      if (!nameEl.value.trim()) return;
      getCurrentClass().students.push({
        id: "s-" + Date.now(),
        name: nameEl.value.trim(),
        rate: Number(rateEl.value) || 0,
        sessions: Number(sessEl.value) || 0,
        discount: Number(discEl.value) || 0,
        paid: false
      });
      nameEl.value = "";
      rateEl.value = "";
      sessEl.value = "";
      discEl.value = "";
      renderAll();
    });

    window.togglePaid = (id) => {
      const s = getCurrentClass().students.find((x) => x.id === id);
      if (s) { s.paid = !s.paid; renderAll(); }
    };

    window.deleteStudent = (id) => {
      const cls = getCurrentClass();
      cls.students = cls.students.filter((x) => x.id !== id);
      renderAll();
    };

    // Log & exam actions
    document.getElementById("btnAddLog").addEventListener("click", () => {
      const dateEl = document.getElementById("logDate");
      const topicEl = document.getElementById("logTopic");
      const mistakeEl = document.getElementById("logMistake");
      if (!topicEl.value.trim() && !mistakeEl.value.trim()) return;
      getCurrentClass().logs.unshift({
        id: "l-" + Date.now(),
        date: dateEl.value,
        topic: topicEl.value.trim(),
        mistake: mistakeEl.value.trim()
      });
      topicEl.value = "";
      mistakeEl.value = "";
      renderAll();
    });

    window.deleteLog = (id) => {
      const cls = getCurrentClass();
      cls.logs = cls.logs.filter((x) => x.id !== id);
      renderAll();
    };

    document.getElementById("btnAddExam").addEventListener("click", () => {
      const stuEl = document.getElementById("examStu");
      const nameEl = document.getElementById("examName");
      const scoreEl = document.getElementById("examScore");
      const retestEl = document.getElementById("examRetest");
      if (!stuEl.value.trim() || !nameEl.value.trim()) return;
      getCurrentClass().exams.unshift({
        id: "e-" + Date.now(),
        student: stuEl.value.trim(),
        exam: nameEl.value.trim(),
        score: scoreEl.value,
        retest: retestEl.value.trim()
      });
      stuEl.value = "";
      nameEl.value = "";
      scoreEl.value = "";
      retestEl.value = "";
      renderAll();
    });

    window.deleteExam = (id) => {
      const cls = getCurrentClass();
      cls.exams = cls.exams.filter((x) => x.id !== id);
      renderAll();
    };

    // LINE Report
    document.getElementById("btnGenerateReport").addEventListener("click", () => {
      const cls = getCurrentClass();
      const lines = [`【DL English 課堂回報｜${cls.name}】`, ""];

      if (cls.logs.length) {
        lines.push("📘 教學與重點紀錄：");
        cls.logs.slice(0, 5).forEach((l) => {
          lines.push(`• ${l.date ? l.date + " " : ""}${l.topic || ""}${l.mistake ? "（提醒：" + l.mistake + "）" : ""}`);
        });
        lines.push("");
      }

      if (cls.exams.length) {
        lines.push("📝 測驗與補考狀況：");
        cls.exams.slice(0, 8).forEach((e) => {
          lines.push(`• ${e.student}｜${e.exam}：${e.score} 分（補考：${e.retest || "無"}）`);
        });
        lines.push("");
      }

      const pendingTodos = cls.todos.filter((t) => !t.done);
      if (pendingTodos.length) {
        lines.push("📌 後續作業／待辦：");
        pendingTodos.forEach((t) => lines.push(`• ${t.title}${t.due ? "（" + t.due + "）" : ""}`));
      }

      document.getElementById("reportOutput").value = lines.join("\n").trim();
    });

    document.getElementById("btnCopyReport").addEventListener("click", async () => {
      const text = document.getElementById("reportOutput").value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        alert("已複製回報文字，可直接貼到 LINE！");
      } catch {
        alert("請手動選取文字框內容複製。");
      }
    });

    // Export JSON & Paste Restore
    document.getElementById("btnExportJson").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `dl-english-workbench-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    const restoreModal = document.getElementById("restoreModal");
    document.getElementById("btnOpenRestore").addEventListener("click", () => {
      document.getElementById("restoreTextarea").value = "";
      restoreModal.classList.add("show");
    });
    document.getElementById("btnCancelRestore").addEventListener("click", () => {
      restoreModal.classList.remove("show");
    });
    document.getElementById("btnConfirmRestore").addEventListener("click", () => {
      try {
        const raw = document.getElementById("restoreTextarea").value.trim();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.classes) || parsed.classes.length === 0) {
          throw new Error("格式不符");
        }
        state = parsed;
        if (!state.classes.some((c) => c.id === state.activeClassId)) {
          state.activeClassId = state.classes[0].id;
        }
        renderAll();
        restoreModal.classList.remove("show");
        alert("資料已成功還原！");
      } catch {
        alert("JSON 格式無效，請確認貼上的內容是否完整。");
      }
    });

    // Password Lock
    const lockModal = document.getElementById("lockModal");
    function openLockModal(requireUnlock = false) {
      isLockedSession = requireUnlock;
      const savedPass = localStorage.getItem(PASS_KEY);
      document.getElementById("lockPasswordInput").value = "";
      document.getElementById("lockModalTitle").textContent = requireUnlock
        ? "🔒 工作台已鎖定，請輸入密碼"
        : (savedPass ? "🔑 輸入密碼解鎖或變更" : "🔒 設定工作台密碼");
      document.getElementById("btnCancelLock").style.display = requireUnlock ? "none" : "inline-block";
      lockModal.classList.add("show");
    }

    document.getElementById("btnLockToggle").addEventListener("click", () => {
      const savedPass = localStorage.getItem(PASS_KEY);
      if (savedPass) {
        openLockModal(true);
      } else {
        openLockModal(false);
      }
    });

    document.getElementById("btnCancelLock").addEventListener("click", () => {
      lockModal.classList.remove("show");
    });

    document.getElementById("btnSubmitLock").addEventListener("click", () => {
      const inputVal = document.getElementById("lockPasswordInput").value;
      const savedPass = localStorage.getItem(PASS_KEY);
      if (!inputVal) {
        alert("請輸入密碼。");
        return;
      }
      if (!savedPass) {
        localStorage.setItem(PASS_KEY, inputVal);
        lockModal.classList.remove("show");
        alert("密碼已設定。");
      } else if (inputVal === savedPass) {
        isLockedSession = false;
        lockModal.classList.remove("show");
      } else {
        alert("密碼錯誤。");
      }
    });

    document.getElementById("btnClearPassword").addEventListener("click", () => {
      const savedPass = localStorage.getItem(PASS_KEY);
      const inputVal = document.getElementById("lockPasswordInput").value;
      if (savedPass && inputVal !== savedPass) {
        alert("請先輸入正確的原密碼才能清除。");
        return;
      }
      localStorage.removeItem(PASS_KEY);
      isLockedSession = false;
      lockModal.classList.remove("show");
      alert("已清除密碼。");
    });

    renderAll();
    if (localStorage.getItem(PASS_KEY)) {
      openLockModal(true);
    }
  </script>
</body>
</html>
