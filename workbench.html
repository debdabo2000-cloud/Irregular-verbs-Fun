<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DL English 教師工作台</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --ink: #1e293b;
      --muted: #64748b;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --soft: #eff6ff;
      --border: #e2e8f0;
      --ok: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      padding-bottom: 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, select, input, textarea {
      font-family: inherit;
      font-size: 0.95rem;
    }

    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink);
      padding: 9px 14px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover { background: #f1f5f9; }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    button.primary:hover { background: var(--primary-dark); }

    button.danger {
      background: #fef2f2;
      border-color: #fecaca;
      color: var(--danger);
    }

    button.danger:hover { background: #fee2e2; }

    .container {
      max-width: 1080px;
      margin: 16px auto 0;
      padding: 0 16px;
    }

    .filter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    select, input[type="text"], input[type="number"], input[type="date"], textarea {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      background: #fff;
      color: var(--ink);
    }

    .nav-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .pill {
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 0.9rem;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .section-card {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .section-card.active { display: block; }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .row-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .item-box {
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .item-main { flex: 1; min-width: 220px; }

    .meta {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 4px;
    }

    .pre-text {
      white-space: pre-wrap;
      margin-top: 6px;
      font-size: 0.92rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .done-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .student-chip {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }

    .modal-bg.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
    }

    .status-msg {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--danger);
      min-height: 20px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="title-group">
        <span>🐾 DL English 教師工作台</span>
      </div>
      <div class="actions">
        <button id="btnExport" type="button">💾 匯出備份</button>
        <button id="btnRestoreOpen" class="primary" type="button">📋 貼上還原</button>
        <button id="btnPinBtn" type="button">🔑 PIN 鎖定</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="filter-card">
      <label for="classFilter"><strong>班級篩選：</strong></label>
      <select id="classFilter"></select>
      <input id="newClassInput" type="text" placeholder="新增班級名稱..." />
      <button id="btnAddClass" type="button">+ 新增班級</button>
    </div>

    <nav class="nav-pills" id="navPills">
      <button class="pill active" data-tab="todos" type="button">📌 待辦事項</button>
      <button class="pill" data-tab="students" type="button">👩‍🎓 學生名冊</button>
      <button class="pill" data-tab="lessons" type="button">📘 上課紀錄</button>
      <button class="pill" data-tab="homeworks" type="button">📝 作業追蹤</button>
      <button class="pill" data-tab="mistakes" type="button">🎯 錯題本</button>
      <button class="pill" data-tab="more" type="button">📦 補考／備課／講義／遊戲</button>
    </nav>

    <!-- Todos -->
    <section id="tab-todos" class="section-card active">
      <div class="section-head">
        <h2>待辦事項</h2>
      </div>
      <div class="row-form">
        <input id="todoText" type="text" placeholder="待辦內容..." style="flex:1; min-width:180px;" />
        <input id="todoTarget" type="text" placeholder="對象／備課標籤" />
        <input id="todoDate" type="date" />
        <button id="btnAddTodo" class="primary" type="button">新增</button>
      </div>
      <div id="todoContainer"></div>
    </section>

    <!-- Students -->
    <section id="tab-students" class="section-card">
      <div class="section-head">
        <h2>學生名冊</h2>
      </div>
      <div class="row-form">
        <input id="stuNameInput" type="text" placeholder="學生姓名" />
        <select id="stuClassSelect"></select>
        <button id="btnAddStudent" class="primary" type="button">新增學生</button>
      </div>
      <div id="studentContainer" class="chip-grid"></div>
    </section>

    <!-- Lessons -->
    <section id="tab-lessons" class="section-card">
      <div class="section-head">
        <h2>上課紀錄</h2>
      </div>
      <div class="row-form">
        <input id="lessonTarget" type="text" placeholder="學生或班級名稱" />
        <input id="lessonDate" type="date" />
        <input id="lessonVersion" type="text" placeholder="版本／教材" />
        <input id="lessonTopic" type="text" placeholder="上課進度／重點" style="flex:1; min-width:180px;" />
        <button id="btnAddLesson" class="primary" type="button">新增紀錄</button>
      </div>
      <div id="lessonContainer"></div>
    </section>

    <!-- Homeworks -->
    <section id="tab-homeworks" class="section-card">
      <div class="section-head">
        <h2>作業追蹤</h2>
      </div>
      <div class="row-form">
        <input id="hwStudent" type="text" placeholder="學生姓名" />
        <input id="hwTitle" type="text" placeholder="作業名稱" />
        <input id="hwType" type="text" placeholder="作業類型" />
        <input id="hwDue" type="date" />
        <button id="btnAddHw" class="primary" type="button">新增作業</button>
      </div>
      <div id="homeworkContainer"></div>
    </section>

    <!-- Mistakes -->
    <section id="tab-mistakes" class="section-card">
      <div class="section-head">
        <h2>錯題本</h2>
      </div>
      <div class="row-form">
        <input id="msStudent" type="text" placeholder="學生姓名" />
        <input id="msPoint" type="text" placeholder="考點／冊次" />
        <textarea id="msContent" rows="2" placeholder="題目與錯題說明..." style="flex:1; min-width:220px;"></textarea>
        <button id="btnAddMs" class="primary" type="button">新增錯題</button>
      </div>
      <div id="mistakeContainer"></div>
    </section>

    <!-- More: Plans, Makeups, Materials, Games -->
    <section id="tab-more" class="section-card">
      <div class="section-head">
        <h2>下堂預排、補考、講義與遊戲連結</h2>
      </div>
      <div id="moreContainer"></div>
    </section>
  </main>

  <!-- Restore Modal -->
  <div id="restoreModal" class="modal-bg" aria-hidden="true">
    <div class="modal-box">
      <h2 style="margin-top:0;">📋 貼上 JSON 還原資料</h2>
      <p class="meta">貼上完整 JSON（以 <code>{</code> 開頭、<code>}</code> 結尾）後按「確認還原」。</p>
      <textarea id="restoreInput" rows="10" style="width:100%;" placeholder='{"pin":"0113","classes":[...]}'></textarea>
      <div id="restoreStatus" class="status-msg"></div>
      <div class="row-form" style="justify-content:flex-end; margin-top:10px; margin-bottom:0;">
        <button id="btnRestoreCancel" type="button">取消</button>
        <button id="btnRestoreConfirm" class="primary" type="button">確認還原</button>
      </div>
    </div>
  </div>

  <!-- PIN Modal -->
  <div id="pinModal" class="modal-bg" aria-hidden="true">
    <div class="modal-box">
      <h2 id="pinTitle" style="margin-top:0;">🔑 PIN 碼管理</h2>
      <p id="pinDesc" class="meta">目前 PIN 碼可於此設定或解除。</p>
      <input id="pinInput" type="password" placeholder="輸入 PIN 碼" style="width:100%; margin-bottom:10px;" />
      <div id="pinStatus" class="status-msg"></div>
      <div class="row-form" style="justify-content:flex-end; margin-bottom:0;">
        <button id="btnPinClear" class="danger" type="button">清除 PIN</button>
        <button id="btnPinClose" type="button">關閉</button>
        <button id="btnPinSave" class="primary" type="button">確認</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "dl_english_workbench_v1";
    const LEGACY_KEY = "dl_workbench_data";
    let selectedClassId = "ALL";

    const emptyData = () => ({
      pin: "",
      classes: [{ id: "c_tutor", name: "個別家教 (1對1)", color: "#ffd6e0" }],
      students: [],
      todos: [],
      lessons: [],
      homeworks: [],
      mistakes: [],
      exams: [],
      billings: [],
      plans: [],
      makeups: [],
      materials: [],
      games: []
    });

    function normalizeData(raw) {
      const base = emptyData();
      if (!raw || typeof raw !== "object") return base;
      const merged = {
        ...base,
        ...raw,
        pin: typeof raw.pin === "string" ? raw.pin : "",
        classes: Array.isArray(raw.classes) && raw.classes.length ? raw.classes : base.classes,
        students: Array.isArray(raw.students) ? raw.students : [],
        todos: Array.isArray(raw.todos) ? raw.todos : [],
        lessons: Array.isArray(raw.lessons) ? raw.lessons : [],
        homeworks: Array.isArray(raw.homeworks) ? raw.homeworks : [],
        mistakes: Array.isArray(raw.mistakes) ? raw.mistakes : [],
        exams: Array.isArray(raw.exams) ? raw.exams : [],
        billings: Array.isArray(raw.billings) ? raw.billings : [],
        plans: Array.isArray(raw.plans) ? raw.plans : [],
        makeups: Array.isArray(raw.makeups) ? raw.makeups : [],
        materials: Array.isArray(raw.materials) ? raw.materials : [],
        games: Array.isArray(raw.games) ? raw.games : []
      };
      return merged;
    }

    function loadData() {
      try {
        const str = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
        if (!str) return emptyData();
        return normalizeData(JSON.parse(str));
      } catch {
        return emptyData();
      }
    }

    let db = loadData();

    function saveData() {
      const json = JSON.stringify(db, null, 2);
      localStorage.setItem(STORAGE_KEY, json);
      localStorage.setItem(LEGACY_KEY, json);
    }

    function esc(v) {
      return String(v ?? "")
        .replaceAll("&", "&")
        .replaceAll("<", "<")
        .replaceAll(">", ">")
        .replaceAll('"', """);
    }

    function byClass(list) {
      if (selectedClassId === "ALL") return list;
      return list.filter((x) => !x.classId || x.classId === selectedClassId);
    }

    function renderClassSelects() {
      const filterEl = document.getElementById("classFilter");
      const stuClsEl = document.getElementById("stuClassSelect");

      filterEl.innerHTML =
        `<option value="ALL" ${selectedClassId === "ALL" ? "selected" : ""}>全部班級</option>` +
        db.classes.map((c) => `<option value="${esc(c.id)}" ${selectedClassId === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("");

      stuClsEl.innerHTML = db.classes
        .map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`)
        .join("");
    }

    function renderTodos() {
      const el = document.getElementById("todoContainer");
      const items = db.todos;
      if (!items.length) {
        el.innerHTML = `<p class="meta">目前沒有待辦事項。</p>`;
        return;
      }
      el.innerHTML = items
        .map((t) => `
          <div class="item-box">
            <div class="item-main">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTodo('${esc(t.id)}')" />
                <strong class="${t.done ? "done-text" : ""}">${esc(t.text || t.title || "")}</strong>
              </label>
              <div class="meta">
                ${t.tag ? `標籤：${esc(t.tag)} · ` : ""}
                ${t.target ? `對象：${esc(t.target)} · ` : ""}
                ${t.date ? `日期：${esc(t.date)}` : ""}
              </div>
            </div>
            <button class="danger" type="button" onclick="delItem('todos', '${esc(t.id)}')">刪除</button>
          </div>
        `)
        .join("");
    }

    function renderStudents() {
      const el = document.getElementById("studentContainer");
      const list = byClass(db.students);
      if (!list.length) {
        el.innerHTML = `<p class="meta">此篩選條件下沒有學生。</p>`;
        return;
      }
      const clsMap = Object.fromEntries(db.classes.map((c) => [c.id, c.name]));
      el.innerHTML = list
        .map((s) => `
          <div class="student-chip" style="background:${esc(s.color || "#f8fafc")}">
            <span>${esc(s.name)}</span>
            <span class="meta" style="margin:0;">(${esc(clsMap[s.classId] || "")})</span>
            <button class="danger" style="padding:4px 8px; font-size:0.8rem;" type="button" onclick="delItem('students', '${esc(s.id)}')">×</button>
          </div>
        `)
        .join("");
    }

    function renderLessons() {
      const el = document.getElementById("lessonContainer");
      const list = byClass(db.lessons);
      if (!list.length) {
        el.innerHTML = `<p class="meta">尚無上課紀錄。</p>`;
        return;
      }
      el.innerHTML = list
        .map((l) => `
          <div class="item-box">
            <div class="item-main">
              <strong>${esc(l.targetName || "")}</strong>
              <span class="meta">${esc(l.date || "")} ${l.version ? `· ${esc(l.version)}` : ""}</span>
              <div class="pre-text">${esc(l.topic || "")}</div>
            </div>
            <button class="danger" type="button" onclick="delItem('lessons', '${esc(l.id)}')">刪除</button>
          </div>
        `)
        .join("");
    }

    function renderHomeworks() {
      const el = document.getElementById("homeworkContainer");
      const list = byClass(db.homeworks);
      if (!list.length) {
        el.innerHTML = `<p class="meta">尚無作業紀錄。</p>`;
        return;
      }
      el.innerHTML = list
        .map((h) => `
          <div class="item-box">
            <div class="item-main">
              <strong>${esc(h.studentName || "")}</strong> — ${esc(h.title || "")}
              <div class="meta">
                ${h.type ? `${esc(h.type)} · ` : ""}
                ${h.due ? `期限：${esc(h.due)} · ` : ""}
                狀態：${esc(h.status || "⏳ 未繳交")}
              </div>
            </div>
            <div style="display:flex; gap:6px;">
              <button type="button" onclick="cycleHwStatus('${esc(h.id)}')">切換狀態</button>
              <button class="danger" type="button" onclick="delItem('homeworks', '${esc(h.id)}')">刪除</button>
            </div>
          </div>
        `)
        .join("");
    }

    function renderMistakes() {
      const el = document.getElementById("mistakeContainer");
      const list = byClass(db.mistakes);
      if (!list.length) {
        el.innerHTML = `<p class="meta">尚無錯題紀錄。</p>`;
        return;
      }
      el.innerHTML = list
        .map((m) => `
          <div class="item-box">
            <div class="item-main">
              <strong>${esc(m.studentName || "")}</strong>
              <span class="meta">${m.point ? `· ${esc(m.point)}` : ""} ${m.status ? `· ${esc(m.status)}` : ""}</span>
              <div class="pre-text">${esc(m.content || "")}</div>
            </div>
            <button class="danger" type="button" onclick="delItem('mistakes', '${esc(m.id)}')">刪除</button>
          </div>
        `)
        .join("");
    }

    function renderMore() {
      const el = document.getElementById("moreContainer");
      const parts = [];

      if (db.plans.length) {
        parts.push(`<h3 style="margin:0 0 8px;">📅 下次上課預排</h3>` + db.plans.map((p) =>
          `<div class="item-box"><div class="item-main"><strong>${esc(p.targetName || "")}</strong> <span class="meta">(${esc(p.date || "")})</span><div>${esc(p.content || "")}</div></div></div>`
        ).join(""));
      }

      if (db.makeups.length) {
        parts.push(`<h3 style="margin:14px 0 8px;">🤒 補課紀錄</h3>` + db.makeups.map((mk) =>
          `<div class="item-box"><div class="item-main"><strong>${esc(mk.studentName || "")}</strong> · ${esc(mk.status || "")} <span class="meta">(${esc(mk.date || "")})</span><div>${esc(mk.reason || "")}</div></div></div>`
        ).join(""));
      }

      if (db.materials.length) {
        parts.push(`<h3 style="margin:14px 0 8px;">📄 講義／教材</h3>` + db.materials.map((mt) =>
          `<div class="item-box"><div class="item-main"><strong>${esc(mt.name || "")}</strong> · ${esc(mt.target || "")} <span class="meta">(${esc(mt.qty ?? 1)} 份 · ${esc(mt.status || "")})</span></div></div>`
        ).join(""));
      }

      if (db.games.length) {
        parts.push(`<h3 style="margin:14px 0 8px;">🎮 互動遊戲連結</h3>` + db.games.map((g) =>
          `<div class="item-box"><div class="item-main"><strong>${esc(g.title || "")}</strong> — <a href="${esc(g.url || "#")}" target="_blank" rel="noopener noreferrer">${esc(g.url || "")}</a></div></div>`
        ).join(""));
      }

      el.innerHTML = parts.length ? parts.join("") : `<p class="meta">目前沒有額外預排、補考、講義或遊戲資料。</p>`;
    }

    function renderAll() {
      renderClassSelects();
      renderTodos();
      renderStudents();
      renderLessons();
      renderHomeworks();
      renderMistakes();
      renderMore();
      saveData();
    }

    // Mutations
    window.toggleTodo = (id) => {
      const t = db.todos.find((x) => x.id === id);
      if (t) { t.done = !t.done; renderAll(); }
    };

    window.cycleHwStatus = (id) => {
      const order = ["⏳ 未繳交", "✅ 已繳交", "🔄 訂正中"];
      const h = db.homeworks.find((x) => x.id === id);
      if (!h) return;
      const idx = order.indexOf(h.status);
      h.status = order[(idx + 1) % order.length];
      renderAll();
    };

    window.delItem = (collection, id) => {
      if (!Array.isArray(db[collection])) return;
      db[collection] = db[collection].filter((x) => x.id !== id);
      renderAll();
    };

    document.getElementById("classFilter").addEventListener("change", (e) => {
      selectedClassId = e.target.value;
      renderAll();
    });

    document.getElementById("btnAddClass").addEventListener("click", () => {
      const input = document.getElementById("newClassInput");
      const name = input.value.trim();
      if (!name) return;
      const id = "c_" + Date.now();
      db.classes.push({ id, name, color: "#dbeafe" });
      selectedClassId = id;
      input.value = "";
      renderAll();
    });

    document.querySelectorAll(".pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pill").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".section-card").forEach((s) => s.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.getElementById("btnAddTodo").addEventListener("click", () => {
      const textEl = document.getElementById("todoText");
      const targetEl = document.getElementById("todoTarget");
      const dateEl = document.getElementById("todoDate");
      if (!textEl.value.trim()) return;
      db.todos.unshift({
        id: "t_" + Date.now(),
        text: textEl.value.trim(),
        tag: "",
        target: targetEl.value.trim(),
        date: dateEl.value,
        done: false
      });
      textEl.value = "";
      targetEl.value = "";
      dateEl.value = "";
      renderAll();
    });

    document.getElementById("btnAddStudent").addEventListener("click", () => {
      const nameEl = document.getElementById("stuNameInput");
      const clsEl = document.getElementById("stuClassSelect");
      if (!nameEl.value.trim()) return;
      db.students.push({
        id: "s_" + Date.now(),
        name: nameEl.value.trim(),
        classId: clsEl.value,
        note: "",
        color: "#e0f2fe"
      });
      nameEl.value = "";
      renderAll();
    });

    document.getElementById("btnAddLesson").addEventListener("click", () => {
      const targetEl = document.getElementById("lessonTarget");
      const dateEl = document.getElementById("lessonDate");
      const verEl = document.getElementById("lessonVersion");
      const topicEl = document.getElementById("lessonTopic");
      if (!targetEl.value.trim() && !topicEl.value.trim()) return;
      db.lessons.unshift({
        id: "l_" + Date.now(),
        targetName: targetEl.value.trim(),
        classId: selectedClassId === "ALL" ? db.classes[0].id : selectedClassId,
        date: dateEl.value,
        version: verEl.value.trim(),
        topic: topicEl.value.trim()
      });
      targetEl.value = "";
      verEl.value = "";
      topicEl.value = "";
      renderAll();
    });

    document.getElementById("btnAddHw").addEventListener("click", () => {
      const stuEl = document.getElementById("hwStudent");
      const titleEl = document.getElementById("hwTitle");
      const typeEl = document.getElementById("hwType");
      const dueEl = document.getElementById("hwDue");
      if (!stuEl.value.trim() || !titleEl.value.trim()) return;
      db.homeworks.unshift({
        id: "h_" + Date.now(),
        studentName: stuEl.value.trim(),
        classId: selectedClassId === "ALL" ? db.classes[0].id : selectedClassId,
        title: titleEl.value.trim(),
        type: typeEl.value.trim(),
        due: dueEl.value,
        status: "⏳ 未繳交"
      });
      stuEl.value = "";
      titleEl.value = "";
      typeEl.value = "";
      dueEl.value = "";
      renderAll();
    });

    document.getElementById("btnAddMs").addEventListener("click", () => {
      const stuEl = document.getElementById("msStudent");
      const ptEl = document.getElementById("msPoint");
      const ctEl = document.getElementById("msContent");
      if (!ctEl.value.trim()) return;
      db.mistakes.unshift({
        id: "m_" + Date.now(),
        studentName: stuEl.value.trim(),
        classId: selectedClassId === "ALL" ? db.classes[0].id : selectedClassId,
        point: ptEl.value.trim(),
        status: "🔴 待出類似題",
        content: ctEl.value.trim()
      });
      stuEl.value = "";
      ptEl.value = "";
      ctEl.value = "";
      renderAll();
    });

    // Export & Restore
    document.getElementById("btnExport").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `dl-english-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    const restoreModal = document.getElementById("restoreModal");
    document.getElementById("btnRestoreOpen").addEventListener("click", () => {
      document.getElementById("restoreInput").value = "";
      document.getElementById("restoreStatus").textContent = "";
      restoreModal.classList.add("open");
    });
    document.getElementById("btnRestoreCancel").addEventListener("click", () => {
      restoreModal.classList.remove("open");
    });
    document.getElementById("btnRestoreConfirm").addEventListener("click", () => {
      const statusEl = document.getElementById("restoreStatus");
      try {
        const raw = document.getElementById("restoreInput").value.trim();
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") {
          statusEl.textContent = "JSON 內容必須是物件（{ ... }）。";
          return;
        }
        db = normalizeData(parsed);
        selectedClassId = "ALL";
        renderAll();
        restoreModal.classList.remove("open");
      } catch (err) {
        statusEl.textContent = "解析失敗：" + (err && err.message ? err.message : "請檢查是否完整複製前後括號與引號");
      }
    });

    // PIN
    const pinModal = document.getElementById("pinModal");
    document.getElementById("btnPinBtn").addEventListener("click", () => {
      document.getElementById("pinInput").value = "";
      document.getElementById("pinStatus").textContent = "";
      document.getElementById("pinDesc").textContent = db.pin
        ? "目前已設定 PIN 碼；輸入新 PIN 碼可更新，或按「清除 PIN」。"
        : "尚未設定 PIN 碼；輸入新 PIN 碼即可儲存。";
      pinModal.classList.add("open");
    });
    document.getElementById("btnPinClose").addEventListener("click", () => {
      pinModal.classList.remove("open");
    });
    document.getElementById("btnPinSave").addEventListener("click", () => {
      const val = document.getElementById("pinInput").value.trim();
      if (!val) {
        document.getElementById("pinStatus").textContent = "請先輸入 PIN 碼。";
        return;
      }
      db.pin = val;
      saveData();
      pinModal.classList.remove("open");
    });
    document.getElementById("btnPinClear").addEventListener("click", () => {
      db.pin = "";
      saveData();
      pinModal.classList.remove("open");
    });

    renderAll();
  </script>
</body>
</html>
